# ==============================================================================
# weft.toml — a starting point
# ==============================================================================
# Location: ~/.config/weft/weft.toml
#
# This file is meant to be edited. It sets up a keyboard-driven tiling setup
# that works on any Mac out of the box, and leaves the machine-specific parts —
# named spaces, per-app placement, status-bar integrations — switched off with
# a worked example next to them.
#
# Everything here hot-reloads: weftd picks up a save within 100 ms via FSEvents.
# Nothing in this file needs a restart.
#
# Two things that are NOT configured here:
#   - Setup & Permissions and this file's own editor live in the menu-bar icon
#   - ctrl-alt-space opens the window switcher (built into WeftBar)
#
# Check a change landed:  weftctl doctor

[general]

# ---------------------------------------------------------------- workspaces
#
# A workspace is a named set of windows with a layout of its own — what
# `alt-1`, `alt-2` and the [[space]] blocks below refer to. This says where
# they live.
#
#   "virtual"  All of your workspaces sit on ONE macOS desktop. Switching
#              between them moves the windows you are not using just off the
#              edge of the screen and puts the others back: instant, nothing
#              animates, and it works on any window — including a terminal
#              with its title bar hidden, which the other mode cannot move.
#              The cost: Mission Control shows a sliver for every hidden
#              window on that one desktop.
#
#   "native"   Each workspace IS one of macOS's own desktops, the way weft
#              worked before 0.9.12. Mission Control and swipes are untouched.
#              The cost: switching animates, and weft moves a window between
#              desktops by dragging its title bar — so a window without one
#              cannot be moved at all.
#
# Your other macOS desktops keep working either way: full-screen apps still
# make their own, swipes still switch them, and weft tiles what is on them.
workspaces = "virtual"

# Which desktop hosts them, by Mission Control number. Ignored under "native".
# An anchor naming a desktop you do not have falls back to your last one —
# `weftctl doctor` says so when that happens.
workspace-anchor = 1

# Gap between neighbouring tiled windows, in pixels.
inner-gap = 8

# Gap between the tiling area and the edge of the screen. A single number
# applies to all four sides; a table sets them separately:
#   outer-gap = { top = 8, bottom = 8, left = 8, right = 8 }
outer-gap = 8

# How far each window in a stack sits below the one in front of it. Stacked
# windows share a slot, so without this a stack looks exactly like a single
# window and there is nothing on screen to say the others are there. The offset
# is vertical only — every member keeps the slot's full width, so switching
# members never jogs the content sideways. Set 0 for flat stacks.
stack-offset = 8

# Whether to tile windows belonging to menu-bar-only apps (Stats, Ice, and
# anything else with no Dock icon). Off, because their windows are dropdown
# panels: tiling one gives it a slot in the layout and takes the focus that
# clicking away would otherwise use to dismiss it, so the panel can only be
# closed by clicking its menu bar icon again. Turn on only if you run a real
# app as an agent and want its windows tiled.
manage-menubar-apps = false

# Whether a rule's `space = "..."` may take the screen over to place a window.
#
# This is the one setting whose default follows another setting, because what
# it costs depends entirely on `workspaces` above.
#
# Under "virtual", placing a window in another workspace on the same desktop is
# bookkeeping plus a fraction of a millisecond. Nothing is visible, so there is
# nothing to protect you from, and leaving this key out means ON.
#
# Under "native" it is the opposite. macOS refuses every API for moving another
# app's window to another desktop, so weft does it the way you would: it holds
# the window by the title bar and presses your "move a space" shortcut, which
# means the screen visibly changes desktop and changes back, about a second per
# desktop travelled. That is fine for `space move-window`, which you just typed
# and are watching — and because you see it either way, that command follows
# the window by default (add `--no-follow` to stay where you are). But a rule
# fires when an app opens, possibly while you are typing in something else, and
# having the desktop switch underneath you is worse than the window landing on
# the wrong one. So under "native", leaving this key out means OFF.
#
# Setting it here pins it either way.
# follow-space-rules = true

# Ask GitHub once a day whether a newer weft has been released, and show a
# menu-bar item when there is one. weft installs from a script or a clone, so
# nothing else would ever tell you a fix exists. It downloads and installs
# nothing — it shows the version and the command to run. Set false to disable.
check-for-updates = true

# Layout for any space that does not name one of its own, below.
#   bsp   — binary split; new windows halve the focused one
#   float — no tiling at all
default-layout = "bsp"

# Drag the border between two tiled windows to resize them, with no modifier
# and no mode. Weft claims a plain click only when it lands inside a border's
# grab strip, so every other click still reaches the app untouched. Set false
# if you would rather nothing ever intercepted an unmodified click.
mouse-border-resize = true

# Held down to drag a window by its body, or right-drag to resize it.
# One of: alt, cmd, ctrl, shift.
mouse-modifier = "alt"

# Warp the cursor to a window when a keybind focuses it. Keeps hover effects
# and scroll wheel on the window you are actually looking at. Set false if a
# jumping cursor bothers you.
mouse-follows-focus = true

# Focus whatever window the cursor happens to be over ("sloppy focus"). Off by
# default: with mouse-follows-focus on as well, the two feed each other.
focus-follows-mouse = false

# Space kept clear for a bar or dock that is always on screen. Set the top to
# your bar's height if you run one — e.g. { top = 32 } for sketchybar.
reserve = 0

# Chromium and Electron apps (Chrome, VS Code, Slack, Discord…) switch on a
# hidden accessibility mode as soon as anything inspects their windows, and
# with it on every resize is slow and animated. weft turns it off for the
# instant of each resize and straight back on after. If a screen reader or
# other assistive tool misbehaves in one of those apps, list it here by bundle
# id and weft will leave it alone.
# enhanced-ui-exempt = ["com.example.app"]

# ------------------------------------------------------------------------------
# Keybindings
# ------------------------------------------------------------------------------
# Chords are hardware key positions, so they are the same on QWERTY, Colemak and
# Dvorak. Modifiers: alt, shift, cmd, ctrl. Named keys: space, tab, return,
# delete, escape, left/right/up/down, bracketleft, bracketright, backslash,
# grave, minus, equal, comma, period, slash, semicolon, quote.
#
# alt-* is used throughout because macOS leaves most of it free. A matched chord
# is swallowed, so alt-h moves focus rather than typing "˙".

[keys]

# Move focus between windows, vim-style.
"alt-h" = "focus west"
"alt-j" = "focus south"
"alt-k" = "focus north"
"alt-l" = "focus east"

# Move the focused window one step that way.
#
# This restructures the layout rather than trading two windows, so the window
# keeps its size: a half-screen window sent east is a half-screen window on the
# right, not a quarter in whatever slot happened to be over there. `swap west`
# and friends are the literal trade, if you want that on a separate key.
"alt-shift-h" = "move west"
"alt-shift-j" = "move south"
"alt-shift-k" = "move north"
"alt-shift-l" = "move east"

# Which way the NEXT window splits the focused one.
"alt-v" = "split vertical"
"alt-shift-v" = "split horizontal"
"alt-backslash" = "window toggle split"

# Zoom the focused window to fill the space; again to put it back.
"alt-f" = "window toggle zoom-fullscreen"

# Take the focused window out of the tiling and let it float; again to re-tile.
# A floated window remembers where you left it, so this really is a toggle.
# `float on` and `float off` are the one-way halves, for scripts.
"alt-shift-space" = "float toggle"

# Even out every split on this space.
"alt-b" = "balance"

# Stacks: several windows sharing one slot, one visible at a time.
# Toggle: stacks the focused window's neighbours, and takes it back out.
"alt-w" = "stack toggle"
"alt-bracketright" = "stack next"
"alt-bracketleft" = "stack prev"
"alt-n" = "stack next"
"alt-p" = "stack prev"
"alt-u" = "stack unstack"

# Change this space's layout on the fly.
"alt-shift-b" = "space layout bsp"
"alt-shift-f" = "space layout float"

# Spaces (desktops), by their Mission Control number. Bound 1-5 because that
# covers most setups without leaving a row of dead keys; add 6-9 the same way
# if you use more. These keep working if you name your spaces below.
"alt-1" = "space focus 1"
"alt-2" = "space focus 2"
"alt-3" = "space focus 3"
"alt-4" = "space focus 4"
"alt-5" = "space focus 5"

# Send the focused window to a space, and go with it.
#
# Moving a window between desktops changes the desktop on the way — macOS
# leaves weft no quieter route — so going with it is the default: coming back
# is one more visible switch to end up where you probably did not want to be.
# Add `--no-follow` to a bind that should send the window and leave you here.
"alt-shift-1" = "space move-window 1"
"alt-shift-2" = "space move-window 2"
"alt-shift-3" = "space move-window 3"
"alt-shift-4" = "space move-window 4"
"alt-shift-5" = "space move-window 5"

# Back to the space you came from.
"alt-tab" = "space focus recent"

# Multi-display. west/east pick the display in that direction geometrically and
# fall back to arrangement order, so they work with a monitor stacked above.
# Harmless on a single display — it reports "already there".
"alt-ctrl-h" = "focus display west"
"alt-ctrl-l" = "focus display east"
# --follow sends the window AND goes with it; drop it to send without leaving.
"alt-ctrl-shift-h" = "move display west --follow"
"alt-ctrl-shift-l" = "move display east --follow"

# Enter the resize layer defined below. Escape or Return leaves it.
"alt-shift-r" = "mode resize"

# Run anything. `exec` hands the rest of the line to /bin/sh, so pipes, quotes
# and $VARIABLES all mean what they mean in a shell — this is the half of skhd
# that is not about windows. Nothing is bound by default because the right
# commands are yours; these are the shapes.
#
# "alt-return"      = "exec open -a Ghostty"
# "alt-shift-4"     = "exec screencapture -i -c"
# "alt-shift-slash" = "exec open 'https://github.com/amiralibg/weft'"
#
# Your command also gets weft's state in its environment, so a script never has
# to ask for it: WEFT_SPACE_ID, WEFT_SPACE_LABEL, WEFT_SPACE_LAYOUT,
# WEFT_SPACE_WINDOWS, WEFT_DISPLAY_UUID, WEFT_DISPLAY_INDEX, WEFT_FOCUSED_WID,
# WEFT_FOCUSED_APP, WEFT_FOCUSED_BUNDLE, WEFT_FOCUSED_TITLE, WEFT_STACK_INDEX,
# WEFT_STACK_COUNT, WEFT_MODE.
#
# "alt-shift-n" = "exec osascript -e \"display notification \\\"$WEFT_SPACE_LABEL\\\"\""

# ------------------------------------------------------------------------------
# Modes
# ------------------------------------------------------------------------------
# A mode is a modal layer, like vim's. While it is active these bare keys are
# captured and nothing else is — so bind an escape route in every mode you add.

[mode.resize]
"h" = "resize left 40"
"l" = "resize right 40"
"j" = "resize down 40"
"k" = "resize up 40"
"shift-h" = "resize left 120"
"shift-l" = "resize right 120"
"shift-j" = "resize down 120"
"shift-k" = "resize up 120"
"equal" = "balance"
"escape" = "mode default"
"return" = "mode default"

# ------------------------------------------------------------------------------
# Window rules
# ------------------------------------------------------------------------------
# Checked top to bottom; the first rule that matches wins. `app` and `title` are
# regular expressions, so "Foo|Bar" matches either.
#
#   manage = false   leave the window completely alone — never tiled, never moved
#   space = "..."    move it there when it opens. Off unless you set
#                    follow-space-rules = true under [general]: weft moves a
#                    window by holding it and switching desktops, and doing
#                    that unprompted takes the screen over while you type.
#
# Weft already floats anything that is not a real window on its own: a dialog
# or popover (its AX subrole is not a standard window), a window the app
# refuses to resize, or a small frameless panel with no title-bar buttons —
# which is what an Electron app's floating call widget or huddle badge is.
# `weftctl query windows` shows the verdict per window in a `floating` field.
# The rules below are for the ones that pass all of that and you still do not
# want tiled.

[[rule]]
app = "System Settings|System Preferences"
manage = false

[[rule]]
app = "Calculator"
manage = false

[[rule]]
app = "Archive Utility|Software Update"
manage = false

# Picture-in-Picture floats over everything by design; tiling it defeats it.
[[rule]]
title = "Picture.in.Picture"
manage = false

# Sending apps to a named space needs the [[space]] blocks below — a rule that
# names a space you have not declared does nothing, and `weftctl doctor` says so.
#
# [[rule]]
# app = "Ghostty|Alacritty|kitty|WezTerm"
# space = "term"
#
# [[rule]]
# app = "Safari|Firefox|Google Chrome|Brave Browser"
# space = "web"

# ------------------------------------------------------------------------------
# Spaces
# ------------------------------------------------------------------------------
# Optional. With no [[space]] blocks — the default — every desktop keeps its
# Mission Control number as its name, which is what the alt-1..5 binds use.
#
# Declaring them gives each desktop a name you can use in rules and keybinds,
# and a layout of its own. Names are handed out in Mission Control order, so
# there must be at least as many desktops as blocks: extra blocks have nowhere
# to land, and anything naming them silently does nothing. Add desktops in
# Mission Control first, then uncomment.
#
# [[space]]
# label = "main"
# layout = "bsp"
#
# [[space]]
# label = "web"
# layout = "float"
#
# [[space]]
# label = "term"
# layout = "bsp"

# ------------------------------------------------------------------------------
# Integrations
# ------------------------------------------------------------------------------
# Both drive a separate program that weft does not install. Switched on without
# the binary present they do nothing at all, so they start off; `weftctl doctor`
# reports the combination, and so does Settings › Integrations.

[integrations.borders]
# Draws a highlight around the focused window. Weft draws it itself; nothing
# to install.
enabled = false

# "native" (default): weft draws them. "janky": JankyBorders does, for its
# extras (gradients, blacklist) — brew install FelixKratz/formulae/borders
# backend = "native"

# With backend = "janky": weftd starts borders and restarts it if it dies.
supervise = true

# What the border looks like. Every one of these reaches borders live — change
# it here or in Settings and it re-applies without a restart.
width = 2.0
style = "round"          # round follows each window's own corners; or "square"
inactive-color = "0x40414868"

# Anything weft does not model goes here, passed straight through, and wins
# over the keys above:
#   args = ["background_color=0x30000000", "blacklist=Safari"]

# Recolour the border by the current layout, and by the active mode. Handy for
# modes: the border turns red the moment you enter the resize layer.
active-color = { bsp = "0xff7aa2f7", float = "0xffe0af68" }
mode-color = { default = "0xff7aa2f7", resize = "0xfff7768e" }

[integrations.sketchybar]
# Fires `sketchybar --trigger weft_event` on layout, space and focus changes,
# with WEFT_* variables describing what changed.
#   brew install FelixKratz/formulae/sketchybar
enabled = false

# Collapse event storms closer together than this, in milliseconds.
coalesce-ms = 16
